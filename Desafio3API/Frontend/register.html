<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Desafio 3 API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card p-4">

                <h1 class="text-center mb-4">
                    Cadastro
                </h1>

                <input
                        type="text"
                        id="registerName"
                        class="form-control mb-3"
                        placeholder="Nome"
                >

                <input
                        type="email"
                        id="registerEmail"
                        class="form-control mb-3"
                        placeholder="Email"
                >

                <input
                        type="password"
                        id="registerPassword"
                        class="form-control mb-3"
                        placeholder="Senha"
                >

                <button
                        class="btn btn-success mb-3"
                        onclick="register()"
                >
                    Cadastrar
                </button>

                <button
                        class="btn btn-secondary"
                        onclick="goToLogin()"
                >
                    Voltar ao Login
                </button>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
